{% extends "auctions/layout.html" %}

{% block body %}

<div class="container">
    <h2>Your current watchlist {{ user.username }}.</h2>
    <h3>{{closeAuction}}</h3>
    <div  class="row row-cols-2">
        {% for m_watchlist in m_watchlists %}
            {% if user.username == m_watchlist.user.username %}
            <div class="col">
                    <a class="nav-link" href="/listings/{{m_watchlist.userwatchlist}}">
                        
                        <img src="{{m_watchlist.URL_image}}" width="100" height="100">
                    </a>
            </div>
            <div class="col">
                <form action="{% url 'delete' %}" method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <input type="hidden" name="delete" value="{{m_watchlist.id}}">
                        <input class="btn btn-primary" type="submit" value="Delete {{m_watchlist.title}} of you watchlist">
                    </div>
                </form>
            </div>
            {% endif %}
        {% endfor %}
    </div>
</div>

{% endblock %}
